plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

// Düz (klasörsüz) dosya düzeni: sadece bu dosyalar derlenir, repodaki diğer dosyalar yok sayılır.
sourceSets {
    main {
        java {
            srcDirs = ['.']
            include 'RainFogClient.java', 'RainFogConfig.java', 'RainSlider.java',
                    'WorldMixin.java', 'InventoryScreenMixin.java', 'ClockMixin.java', 'SoundMixin.java'
        }
        resources {
            srcDirs = ['.']
            include 'fabric.mod.json', 'rainfog.mixins.json'
        }
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}
